server {
    listen 80;
    server_name erp.ifungoo.cn;
    index index.html index.htm default.htm default.html;
    root /www/wwwroot/ifungoo_erp;
    include /www/server/panel/vhost/nginx/extension/ifungoo_erp/*.conf;

    #CERT-APPLY-CHECK--START

    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/ifungoo_erp.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL相关配置

    #error_page 404/404.html;

    #SSL-END

    #ERROR-PAGE-START  错误页相关配置

    #error_page 404 /404.html;

    #error_page 502 /502.html;

    #ERROR-PAGE-END

    #REWRITE-START 伪静态相关配置
    include /www/server/panel/vhost/rewrite/python_ifungoo_erp.conf;
    #REWRITE-END

    # HTTP反向代理相关配置开始 >>>
    location /api {
        proxy_pass http://127.0.0.1:39800;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        root /www/wwwroot/ifungoo_erp/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
    # HTTP反向代理相关配置结束 <<<
    access_log /www/wwwlogs/ifungoo_erp.log;
    error_log /www/wwwlogs/ifungoo_erp.error.log;
}
